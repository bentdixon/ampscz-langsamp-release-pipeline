[project]
name = "ampscz-langsamp-release-pipeline"
version = "0.2.0"
description = "Utilities for structuring and parsing transcripts for the AMPSCZ NDA Data Release 4 and beyond"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Dixon" },
    { name = "Phillip Wolff" },
]

dependencies = [
    # vllm ships Linux-only wheels and requires CUDA; skipped on macOS dev machines
    "vllm; sys_platform == 'linux'",
    "polars",
    "stanza",
    "rich",
    "spacy",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "flake8",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "preprocessing*", "extraction*", "postprocessing*"]
