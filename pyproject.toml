[project]
name = "ampscz-langsamp-release-pipeline"
version = "0.2.0"
description = "Utilities for structuring and parsing transcripts for the AMPSCZ NDA Data Release 4 and beyond"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Dixon" },
    { name = "Phillip Wolff" },
]

dependencies = [
    # vllm ships Linux-only wheels and requires CUDA; skipped on macOS dev machines
    "vllm; sys_platform == 'linux'",
    "polars",
    "stanza",
    "rich",
    "spacy",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "flake8",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The repository .gitignore is "*" (force-add policy), which would otherwise
# hide every file from ruff
respect-gitignore = false
extend-exclude = ["Delete", "runs", ".venv"]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "preprocessing*", "extraction*", "postprocessing*"]
